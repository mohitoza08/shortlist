name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shortlist
          POSTGRES_PASSWORD: shortlist
          POSTGRES_DB: shortlist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shortlist" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://shortlist:shortlist@localhost:5432/shortlist
      DIRECT_URL: postgresql://shortlist:shortlist@localhost:5432/shortlist
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      AUTH_URL: http://localhost:3000
      AI_MOCK: "1"
      SEED_DEMO_PASSWORD: Demo1234!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
